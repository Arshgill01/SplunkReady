name: SplunkReady agent gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  external-trace-sdk:
    name: External trace SDK gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SplunkReady
        run: npm run build

      - name: Compile fixture contract
        run: npm run splunkready -- compile --mode fixture --out artifacts/ci-external-trace --json

      - name: Grade captured external agent trace
        run: npm run splunkready -- grade-trace --trace examples/sample-external-trace-pass.json --out artifacts/ci-external-trace --agent-name "External MCP Agent" --agent-version "ci-trace-pass" --json

      - name: Block merge unless external agent receipt is READY
        run: npm run splunkready -- proof-audit --out artifacts/ci-external-trace --require-pass true --json

      - name: Upload external trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunkready-ci-external-trace
          path: artifacts/ci-external-trace

  fixture-smoke:
    name: Fixture receipt smoke gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SplunkReady
        run: npm run build

      - name: Run multi-mission fail-to-pass suite
        run: npm run splunkready -- suite-proof --mode fixture --suite fixtures/acme-soc-dev/suites/phase-live-readiness-suite.json --out artifacts/ci-suite-proof --require-fail-to-pass true --json

      - name: Audit multi-mission suite proof
        run: npm run splunkready -- proof-audit --out artifacts/ci-suite-proof --require-pass true --json

      - name: Prove firewall blocks unsafe SPL before Splunk
        run: npm run splunkready -- firewall-check --mode fixture --out artifacts/ci-firewall --json

      - name: Compile fixture contract
        run: npm run splunkready -- compile --mode fixture --out artifacts/ci-readiness --json

      - name: Evaluate specimen agent
        run: npm run splunkready -- evaluate --mode fixture --out artifacts/ci-readiness --json

      - name: Issue Readiness Receipt
        run: npm run splunkready -- receipt --out artifacts/ci-readiness --json

      - name: Rerun with compiled policy
        run: npm run splunkready -- rerun --mode fixture --out artifacts/ci-readiness --json

      - name: Write diagnostic proof audit
        run: npm run splunkready -- proof-audit --out artifacts/ci-readiness --json

      - name: Block merge unless fixture receipt is READY
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const receipt = JSON.parse(await readFile("artifacts/ci-readiness/receipt-after-001.json", "utf8"));

          if (receipt.verdict !== "READY") {
            console.error(`SplunkReady blocked this change: ${receipt.verdict} (${receipt.score}/100).`);
            console.error(`Violations: ${(receipt.violations ?? []).join(", ") || "none"}`);
            process.exit(1);
          }

          console.log(`SplunkReady receipt is READY (${receipt.score}/100).`);
          NODE

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunkready-ci-readiness
          path: |
            artifacts/ci-readiness
            artifacts/ci-suite-proof
            artifacts/ci-firewall

  live-security-proof:
    name: Live security proof gate
    runs-on: ubuntu-latest
    if: ${{ vars.SPLUNKREADY_LIVE_ENABLED == 'true' }}
    permissions:
      contents: read
    env:
      SPLUNKREADY_LIVE_ENABLED: "true"
      SPLUNKREADY_SPLUNK_MCP_URL: ${{ secrets.SPLUNKREADY_SPLUNK_MCP_URL }}
      SPLUNKREADY_SPLUNK_MCP_TOKEN: ${{ secrets.SPLUNKREADY_SPLUNK_MCP_TOKEN }}
      SPLUNKREADY_SPLUNK_APP: ${{ vars.SPLUNKREADY_SPLUNK_APP || 'search' }}
      SPLUNKREADY_LLM_ENABLED: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      NODE_TLS_REJECT_UNAUTHORIZED: ${{ vars.SPLUNKREADY_NODE_TLS_REJECT_UNAUTHORIZED || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SplunkReady
        run: npm run build

      - name: Run live security proof
        run: npm run splunkready -- live-security-proof --out artifacts/live-security-proof --json

      - name: Block merge unless live proof audit is PASS
        run: npm run splunkready -- proof-audit --out artifacts/live-security-proof --require-pass true --json

      - name: Upload live proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunkready-live-security-proof
          path: artifacts/live-security-proof
