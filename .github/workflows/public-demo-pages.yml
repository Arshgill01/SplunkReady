name: Public Demo Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build public demo export
        run: npm run public-demo:build

      - name: Audit public demo export
        run: npm run audit:public-demo-export

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public demo artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/public-demo

  deploy:
    name: Deploy public demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
