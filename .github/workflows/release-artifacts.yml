name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standalone:
    name: standalone ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and smoke standalone artifact
        run: node scripts/build-standalone-release.mjs --smoke

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: splunkready-standalone-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/splunkready-*.tar.gz
            dist/release/splunkready-*.tar.gz.sha256
            dist/release/standalone-release-*.json
          if-no-files-found: error

  publish-release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: standalone
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          mapfile -t assets < <(find dist/release-assets -type f \( -name 'splunkready-*.tar.gz' -o -name 'splunkready-*.tar.gz.sha256' -o -name 'standalone-release-*.json' \) | sort)

          if [[ "${#assets[@]}" -ne 9 ]]; then
            printf 'Expected 9 release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          gh release view "${tag}" >/dev/null 2>&1 || gh release create "${tag}" --title "SplunkReady ${tag}" --notes "Standalone SplunkReady release artifacts."
          gh release upload "${tag}" "${assets[@]}" --clobber
